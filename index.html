<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn Conjugations</title>
  <link rel="icon" type="image/png" href="splash.png">

  <script>
    const appStore = "https://apps.apple.com/us/app/learn-conjugations/id6742377639";
    const playStore = "https://play.google.com/store/apps/details?id=com.clement.conjugationapp&pcampaignid=web_share";

    const ua = navigator.userAgent || navigator.vendor || window.opera;

    if (/android/i.test(ua)) {
      window.location.replace(playStore);
    } else if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
      window.location.replace(appStore);
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f8fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 40px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
    }

    .icon {
      width: 120px;
      height: 120px;
      border-radius: 24px;
      object-fit: cover;
      margin-bottom: 24px;
      box-shadow: 0 6px 18px rgba(0,0,0,.15);
    }

    h1 {
      margin: 0;
      font-size: 2rem;
    }

    .subtitle {
      margin-top: 16px;
      color: #555;
      line-height: 1.6;
      font-size: 1.05rem;
    }

    .badges {
      margin-top: 36px;
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .badges img {
      height: 60px;
      transition: transform .15s ease;
    }

    .badges img:hover {
      transform: scale(1.04);
    }

    footer {
      margin-top: 40px;
      color: #999;
      font-size: .9rem;
    }
  </style>
</head>

<body>

<div class="card">

  <!-- Replace icon.png with your app icon -->
  <img class="icon" src="icon.png" alt="Learn Conjugations">

  <h1>Learn Conjugations</h1>

  <p class="subtitle">
     Practice verb conjugations in the language you're learning. Pick your verbs and tenses, drill them in quick sessions, get instant right/wrong feedback, and review on a spaced schedule so it actually sticks.
  </p>

  <div class="badges">

    <a href="https://apps.apple.com/us/app/learn-conjugations/id6742377639">
      <img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg"
           alt="App Store">
    </a>

    <a href="https://play.google.com/store/apps/details?id=com.clement.conjugationapp&pcampaignid=web_share">
      <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg"
           alt="Google Play">
    </a>

  </div>

  <footer>
    Designed & developed by <strong>Clément Perrier</strong>
  </footer>

</div>

</body>
</html>
